<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr.MCQuuu</title>
<meta name="description" content="授業スライド（PDF・PowerPoint）を入れるだけで、選択問題と短い記述問題の問題集ができます。解説・出典・日本語／中文／Bahasa Melayu の訳つき。まちがえた問題は自動で復習に回ります。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316202b'/%3E%3Crect x='7' y='8' width='18' height='4' rx='2' fill='%23d9a648'/%3E%3Crect x='7' y='15' width='12' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='21' width='15' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one study column under a slim top bar. Library cards → deck page (tiles, filters) → question card. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#f5f7f9; --ink:#16202b; --muted:#566473; --line:#d3dae1;
  --brass:#8a5d17; --on-brass:#ffffff; --ok:#1d7448; --ok-soft:#e1f1e8; --bad:#ad2a22; --bad-soft:#fae5e2;
  --warn:#9a4d00; --warn-soft:#fbeedd; --due:#1f5f8b; --due-soft:#e2eef7;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f151b; --surface:#17202a; --sunk:#121a22; --ink:#e4eaf0; --muted:#97a6b4; --line:#2b3844;
    --brass:#d9a648; --on-brass:#1b1307; --ok:#5cc792; --ok-soft:#15301f; --bad:#f08a80; --bad-soft:#3a1d1a;
    --warn:#f0a75a; --warn-soft:#38270f; --due:#7cb8e6; --due-soft:#142a3b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}
a{color:inherit}
[hidden]{display:none !important}
img{max-width:100%}

.topbar{position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top, 0px); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar-in{max-width:820px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:8px; text-decoration:none; font-family:var(--f-display); font-weight:800; font-size:1.05rem; letter-spacing:-.01em}
.brand i{width:20px; height:20px; border-radius:5px; background:var(--ink); position:relative; display:inline-block}
.brand i::before{content:""; position:absolute; left:4px; right:4px; top:5px; height:3px; border-radius:2px; background:var(--brass)}
.brand i::after{content:""; position:absolute; left:4px; right:8px; top:11px; height:2px; border-radius:1px; background:var(--surface); box-shadow:0 4px 0 var(--surface)}
.topnav{display:flex; gap:2px; flex-wrap:wrap}
.topnav a{text-decoration:none; font-size:.86rem; padding:6px 10px; border-radius:6px; color:var(--muted)}
.topnav a:hover{color:var(--ink); background:var(--sunk)}
.topnav a[aria-current="page"]{color:var(--ink); background:var(--sunk); font-weight:500}

main{max-width:820px; margin:0 auto; display:grid; gap:18px; padding-block:24px 80px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font-family:var(--f-display); font-weight:800; font-size:clamp(1.45rem, 4vw, 1.9rem); line-height:1.2; margin:0; letter-spacing:-.01em; text-wrap:balance}
h2{font-family:var(--f-display); font-weight:800; font-size:1.02rem; margin:0}
p{margin:0}
.eyebrow{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--brass)}
.lede{color:var(--muted); max-width:64ch}
.hint{font-size:.8rem; color:var(--muted)}
.muted{color:var(--muted)}
code{font-family:var(--f-mono); font-size:.85em; background:var(--sunk); border:1px solid var(--line); border-radius:4px; padding:0 4px}
.page-head{display:grid; gap:6px}
.row-between{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px}
.crumb{font-size:.85rem; color:var(--muted)}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}

.hero{display:grid; gap:12px; padding-block:8px}
.hero h1{font-size:clamp(1.6rem, 5vw, 2.3rem)}
.steps{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px}
.steps div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:grid; gap:4px; font-size:.88rem}
.steps b{font-family:var(--f-display)}
@media (max-width:640px){ .steps{grid-template-columns:1fr} }

.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:12px; min-width:0}
.panel.notice{border-color:var(--brass)}
.form{gap:14px}
.field{display:grid; gap:6px}
.field > span:first-child{font-size:.8rem; color:var(--muted); font-weight:500}
input[type=text], input[type=email], input[type=password], select, textarea{font:inherit; color:var(--ink); background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%; min-width:0}
textarea.mono{font-family:var(--f-mono); font-size:.8rem; line-height:1.5}
input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--brass); outline-offset:1px}
.key-row{display:flex; gap:8px}
.status{font-size:.85rem; min-height:1.4em}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}

.row{display:grid; grid-template-columns:64px 1fr; gap:10px; align-items:start}
.row-label{font-size:.78rem; color:var(--muted); padding-top:5px; font-weight:500}
@media (max-width:520px){ .row{grid-template-columns:1fr; gap:4px} .row-label{padding-top:0} }
.chips{display:flex; flex-wrap:wrap; gap:6px; min-width:0}
.chip{font:inherit; font-size:.82rem; line-height:1.3; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--sunk); color:var(--ink); cursor:pointer; max-width:100%; overflow-wrap:anywhere; text-align:left}
.chip .n{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); margin-left:5px}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.chip[aria-pressed="true"] .n{color:inherit; opacity:.7}
.chip:disabled{opacity:.45; cursor:not-allowed}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; font:inherit; font-weight:600; font-size:.9rem; padding:9px 16px; border-radius:8px; border:1px solid var(--ink); background:var(--ink); color:var(--surface); cursor:pointer; text-decoration:none; line-height:1.3}
.btn.big{padding:11px 22px; font-size:.95rem}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.link{font:inherit; font-size:.8rem; background:none; border:none; padding:0; color:var(--muted); text-decoration:underline; cursor:pointer; justify-self:start}
.row-btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end}
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .link:focus-visible, .deck-card:focus-visible, .drop:focus-within{outline:2px solid var(--brass); outline-offset:2px}

.drop{display:grid; gap:4px; place-items:center; text-align:center; padding:28px 16px; border:2px dashed var(--line); border-radius:10px; background:var(--sunk); cursor:pointer}
.drop.over{border-color:var(--brass); background:var(--surface)}
.drop input{position:absolute; width:1px; height:1px; opacity:0}
.drop span{font-size:.85rem; color:var(--muted)}
.file-list{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.file-list li{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; font-size:.88rem; padding:6px 10px; border:1px solid var(--line); border-radius:8px}
.fname{min-width:0; overflow-wrap:anywhere}
.fsize{font-family:var(--f-mono); font-size:.75rem; color:var(--muted)}
.file-btn{position:relative; justify-self:start}
.file-btn input{position:absolute; inset:0; opacity:0; cursor:pointer}
.howto{margin:0; padding-left:1.3em; display:grid; gap:4px}
.fail-list{margin:0; padding-left:1.2em; display:grid; gap:6px; font-size:.88rem}

.gen{gap:10px}
.gen-now{font-weight:600}
.gen-bar-row{display:flex; align-items:center; gap:10px}
.gen-bar-row .bar{flex:1; height:8px; border-radius:4px}
.gen-bar-row .bar > i{transition:width .3s linear}
.gen-bar-row .bar > i{position:relative; overflow:hidden}
.gen-bar-row .bar > i::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform:translateX(-100%); animation:gen-sheen 1.6s linear infinite}
@keyframes gen-sheen{to{transform:translateX(100%)}}
.gen-live{display:flex; align-items:center; gap:8px; font-size:.9rem; min-height:1.5em}
.gen-left{margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums}
.gen-dot{width:8px; height:8px; border-radius:50%; background:var(--brass); animation:gen-pulse 1.1s ease-in-out infinite}
@keyframes gen-pulse{0%,100%{opacity:.25; transform:scale(.8)} 50%{opacity:1; transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){ .gen-bar-row .bar > i::after, .gen-dot{animation:none} }
.gen-pct{min-width:3.2em; text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.gen-away{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--soft,rgba(127,127,127,.08));font-size:13px;line-height:1.6;color:var(--muted,inherit)}
.gen-stats{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}

.deck-list{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.deck-card{display:grid; gap:6px; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.deck-card:hover{border-color:var(--brass)}
.deck-title{font-family:var(--f-display); font-weight:800; font-size:1.05rem}
.deck-meta{font-size:.82rem; color:var(--muted); overflow-wrap:anywhere}
.deck-chips{display:flex; flex-wrap:wrap; gap:6px}
.pill{font-size:.74rem; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink); white-space:nowrap}
.pill.warn{background:var(--warn-soft); border-color:transparent; color:var(--warn); font-weight:600}
.pill.due{background:var(--due-soft); border-color:transparent; color:var(--due); font-weight:600}
.pill.muted{color:var(--muted)}

.tiles{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:grid; gap:2px}
.tile-n{font-family:var(--f-display); font-weight:800; font-size:1.6rem; line-height:1.1; font-variant-numeric:tabular-nums}
.tile-l{font-size:.78rem; color:var(--muted)}
.tile.warn .tile-n{color:var(--warn)}
.tile.due .tile-n{color:var(--due)}
@media (max-width:520px){ .tiles{grid-template-columns:repeat(2, minmax(0, 1fr))} }

.qlist summary{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; cursor:pointer; list-style:none}
.qlist summary::-webkit-details-marker{display:none}
.qlist summary h2::before{content:"▸ "; color:var(--muted)}
.qlist[open] summary h2::before{content:"▾ "}
.qlist ol{margin:0; padding-left:1.4em; display:grid; gap:10px}
.qlist li{display:grid; gap:2px; font-size:.86rem; min-width:0}
.qlist li.is-hidden{opacity:.5}
.ql-q{font-weight:500; overflow-wrap:anywhere}
.ql-a{color:var(--ok)}
.ql-m{font-size:.76rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; align-items:center}

.progress{display:grid; gap:8px}
.progress-line{display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 16px; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
.progress-line b{color:var(--ink); font-weight:600}
.bar{display:block; height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.bar > i{display:block; height:100%; width:0; background:var(--brass); transition:width .25s}

.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 20px 18px; display:grid; gap:16px; min-width:0}
.meta{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.keytag{display:inline-flex; align-items:center; gap:7px; font-family:var(--f-mono); font-size:.78rem; font-weight:500; padding:3px 12px 3px 8px; border-radius:3px 14px 14px 3px; background:var(--brass); color:var(--on-brass); font-variant-numeric:tabular-nums}
.keytag::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--surface)}
.pri{font-size:.72rem; padding:2px 8px; border-radius:4px; font-weight:600; border:1px solid transparent; white-space:nowrap}
.pri.p3{background:var(--ink); color:var(--surface)}
.pri.p2{border-color:var(--ink); color:var(--ink)}
.pri.p1{border-color:var(--line); color:var(--muted)}
.where{font-size:.78rem; color:var(--muted); overflow-wrap:anywhere}
.q{font-family:var(--f-display); font-weight:600; font-size:1.16rem; line-height:1.5; text-wrap:pretty; overflow-wrap:anywhere}
.ja{margin-top:-8px; color:var(--muted); font-size:.9rem}
.opts{display:grid; gap:8px; list-style:none; margin:0; padding:0}
.opt{width:100%; display:grid; grid-template-columns:26px 1fr auto; gap:12px; align-items:start; text-align:left; font:inherit; font-size:.96rem; line-height:1.5; color:var(--ink); background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:11px 14px; cursor:pointer; transition:border-color .12s, background-color .12s}
.opt-t{min-width:0; overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--f-mono); font-size:.78rem; width:26px; height:26px; display:grid; place-items:center; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--muted)}
.opt .mark{font-size:.74rem; font-weight:700; align-self:center; white-space:nowrap}
.opt.is-correct{background:var(--ok-soft); border-color:var(--ok)}
.opt.is-correct .k{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.is-correct .mark{color:var(--ok)}
.opt.is-wrong{background:var(--bad-soft); border-color:var(--bad)}
.opt.is-wrong .k{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt.is-wrong .mark{color:var(--bad)}
.opt.is-dim{opacity:.55}
.fb{display:grid; gap:12px; border-top:1px dashed var(--line); padding-top:14px}
.verdict{font-family:var(--f-display); font-weight:800; font-size:1.08rem; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline}
.verdict.ok{color:var(--ok)}
.verdict.ng{color:var(--bad)}
.verdict-sub{font-family:var(--f-body); font-weight:500; font-size:.8rem; color:var(--warn)}
.src{background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; gap:5px; font-size:.86rem; min-width:0}
.src-head{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--brass)}
.src-loc{font-weight:600; overflow-wrap:anywhere}
.src-quote{font-family:var(--f-mono); font-size:.8rem; padding-top:6px; border-top:1px solid var(--line); overflow-wrap:anywhere}
.nav{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.keys{text-align:center}
kbd{font-family:var(--f-mono); font-size:.72rem; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--surface); color:var(--ink)}

.score{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.score-big{font-family:var(--f-display); font-weight:800; font-size:3rem; line-height:1; font-variant-numeric:tabular-nums}
.score-sub{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.86rem; font-variant-numeric:tabular-nums}
th, td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line)}
th{font-weight:500; color:var(--muted); font-size:.78rem}
.num{text-align:right}
.wl{display:grid; gap:8px; list-style:none; margin:0; padding:0}
.wl li{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--sunk); display:grid; gap:3px; font-size:.88rem; min-width:0}
.wl-q{font-weight:600; overflow-wrap:anywhere}
.wl-a{color:var(--ok)}
.wl-s{font-size:.76rem; color:var(--muted)}

.lib-head{margin-top:10px}
.link.inline{font-size:inherit; display:inline}
.opts summary{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; cursor:pointer; list-style:none}
.opts summary::-webkit-details-marker{display:none}
.opts summary h2::before{content:"▸ "; color:var(--muted)}
.opts[open] summary h2::before{content:"▾ "}
.plan-line{font-size:.85rem; color:var(--muted)}
.plan-line a{color:var(--brass); font-weight:600}
.file-list li.locked .fname{color:var(--muted)}
.pill.lock{background:var(--sunk); color:var(--muted); margin-left:6px}
.panel.upsell{border-color:var(--brass)}
.plans{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px}
@media (max-width:640px){ .plans{grid-template-columns:1fr} }
.plan{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:10px; align-content:start; justify-items:start}
.plan.pro{border-color:var(--brass)}
.plan ul{margin:0; padding-left:1.2em; display:grid; gap:4px; font-size:.9rem}
.price{font-family:var(--f-display); font-weight:800; font-size:2rem; line-height:1.1; font-variant-numeric:tabular-nums}
.price span{font-family:var(--f-body); font-weight:500; font-size:.9rem; color:var(--muted)}

.ans-area{display:grid; gap:8px}
.ans-area label{font-size:.8rem; color:var(--muted)}
.card textarea{min-height:7.5em; resize:vertical; line-height:1.6}
.card textarea:disabled{opacity:.8}
.model{display:grid; gap:6px; background:var(--ok-soft); border:1px solid var(--ok); border-radius:8px; padding:12px 14px; min-width:0}
.model-head{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ok)}
.model p{overflow-wrap:anywhere}
.pts{margin:4px 0 0; padding:0; list-style:none; display:grid; gap:4px}
.pts li{display:grid; grid-template-columns:18px 1fr; gap:6px; font-size:.9rem}
.pts li::before{content:"✓"; color:var(--ok); font-weight:700}
.grades{display:flex; flex-wrap:wrap; gap:8px}
.grade{font:inherit; font-size:.9rem; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--sunk); color:var(--ink); cursor:pointer; display:flex; gap:8px; align-items:center}
.grade.g-ok:hover{border-color:var(--ok)} .grade.g-part:hover{border-color:var(--warn)} .grade.g-ng:hover{border-color:var(--bad)}
.grade:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.verdict.part{color:var(--warn)}
footer a{color:inherit}

.langs{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.langs button{font:inherit; font-size:.8rem; font-weight:600; padding:5px 10px; border:none; border-left:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer}
.langs button:first-child{border-left:none}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.langs button:focus-visible{outline:2px solid var(--brass); outline-offset:-2px}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:20; display:flex; gap:12px; align-items:center;
